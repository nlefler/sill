[workspace]
resolver = "2"
members = ["crates/sill-proto", "crates/sill-net", "crates/sill-mockhost", "crates/sill-discovery", "crates/sill-media", "crates/sill-input", "crates/sill-app", "crates/sill-ui-state"]

[profile.dev.package.ring]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "net", "io-util", "time", "sync", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
x509-parser = "0.16"
sha2 = "0.10"
ring = "0.17"
sill-proto = { path = "crates/sill-proto" }
sill-net = { path = "crates/sill-net" }
sill-discovery = { path = "crates/sill-discovery" }
sill-media = { path = "crates/sill-media" }
sill-input = { path = "crates/sill-input" }
sill-ui-state = { path = "crates/sill-ui-state" }
